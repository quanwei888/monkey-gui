<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 机器人头部 -->
    <rect x="7" y="5" width="10" height="8" rx="2" fill="#A16207" stroke="#92400E" stroke-width="1"/>

    <!-- 机器人眼睛 -->
    <circle cx="9.5" cy="8" r="1" fill="white"/>
    <circle cx="14.5" cy="8" r="1" fill="white"/>
    <circle cx="9.5" cy="8" r="0.4" fill="#451A03"/>
    <circle cx="14.5" cy="8" r="0.4" fill="#451A03"/>

    <!-- 机器人嘴巴 -->
    <rect x="10.5" y="10.5" width="3" height="1" rx="0.5" fill="white"/>

    <!-- 机器人天线 -->
    <line x1="12" y1="5" x2="12" y2="3" stroke="#A16207" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="3" r="0.8" fill="#D97706"/>

    <!-- 机器人身体 -->
    <rect x="8" y="13" width="8" height="6" rx="1" fill="#A16207" stroke="#92400E" stroke-width="1"/>

    <!-- 机器人胸前装饰 -->
    <rect x="10" y="15" width="4" height="2" rx="0.5" fill="#D97706"/>
    <circle cx="12" cy="16" r="0.3" fill="#451A03"/>

    <!-- 机器人手臂 -->
    <rect x="5" y="14" width="2" height="4" rx="1" fill="#A16207"/>
    <rect x="17" y="14" width="2" height="4" rx="1" fill="#A16207"/>

    <!-- 机器人腿部 -->
    <rect x="9" y="19" width="2" height="3" rx="1" fill="#A16207"/>
    <rect x="13" y="19" width="2" height="3" rx="1" fill="#A16207"/>

    <!-- 机器人脚部 -->
    <ellipse cx="10" cy="22.5" rx="1.5" ry="0.8" fill="#92400E"/>
    <ellipse cx="14" cy="22.5" rx="1.5" ry="0.8" fill="#92400E"/>
</svg>
